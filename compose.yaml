services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: revynora
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: revynora
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revynora -d revynora"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
