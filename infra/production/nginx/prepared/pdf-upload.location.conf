# Preparation only: insert into the existing HTTPS server; never replace it.
# Exact path only; config, /:id and /:id/analyze keep the 1m server limit.
# GET list shares this URL; Nginx limit is per location, not a method ACL.
location = /api/v1/documents {
    client_max_body_size 4m;
    limit_req zone=revynora_api burst=60 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/revynora-proxy.conf;
}
