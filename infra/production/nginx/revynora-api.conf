server {
    listen 80;
    listen [::]:80;
    server_name api.revynora.watercode.dev;
    location /.well-known/acme-challenge/ { root /var/www/revynora-acme; }
    location / { return 301 https://api.revynora.watercode.dev$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.revynora.watercode.dev;
    ssl_certificate /etc/letsencrypt/live/revynora-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revynora-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/revynora-api.access.log;
    error_log /var/log/nginx/revynora-api.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location /api/v1/auth/ {
        limit_req zone=revynora_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/revynora-proxy.conf;
    }
    location /api/v1/ {
        limit_req zone=revynora_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/revynora-proxy.conf;
    }
    location / { return 404; }
}
