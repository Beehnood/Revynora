name: Web validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: web-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ADMIN_WEB_INTEGRATION_ENABLED: "false"
      AI_PROVIDER: mock
      BILLING_PROVIDER: mock
      MAIL_PROVIDER: local
      WORKER_ENABLED: "false"
      COOKIE_SECURE: "false"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      EXPO_PUBLIC_API_URL: https://api.example.test/api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec turbo typecheck --filter=@revynora/web
      - run: pnpm --filter @revynora/web lint
      - run: pnpm --filter @revynora/web test:coverage
      - run: pnpm build:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-quality
          path: apps/web/coverage
