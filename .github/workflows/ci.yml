name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  foundation:
    name: quality-foundation
    # Playwright 1.56.1 supports Ubuntu 24.04, not the 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_URL: https://api.example.test/api/v1
      ADMIN_WEB_INTEGRATION_ENABLED: "false"
      AI_PROVIDER: mock
      BILLING_PROVIDER: mock
      MAIL_PROVIDER: local
      WORKER_ENABLED: "false"
      COOKIE_SECURE: "false"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      DATABASE_URL: postgresql://revynora:local_dev_only@127.0.0.1:5433/revynora_test?schema=public
      TEST_DATABASE_URL: postgresql://revynora:local_dev_only@127.0.0.1:5433/revynora_test?schema=public
      WEB_ORIGIN: http://localhost:3000
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      G8_ISOLATED_TEST_DB: "true"
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: revynora
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: revynora_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U revynora -d revynora_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.6-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify isolated database and Mock providers
        run: |
          node - <<'JS'
          for (const name of ['DATABASE_URL', 'TEST_DATABASE_URL']) {
            const url = new URL(process.env[name]);
            if (url.hostname !== '127.0.0.1' || url.port !== '5433' || url.pathname !== '/revynora_test') throw Error('Isolated CI database required');
          }
          if (process.env.G8_ISOLATED_TEST_DB !== 'true' || process.env.BILLING_PROVIDER !== 'mock' || process.env.AI_PROVIDER !== 'mock' || process.env.STRIPE_SECRET_KEY) throw Error('Mock-only CI required');
          JS
      - run: pnpm check:boundaries
      - run: node --test scripts/check-boundaries.test.mjs
      - name: Registration collector unit tests and isolation guard
        run: node --test scripts/registration-e2e/collector.test.mjs scripts/ci-playwright.test.cjs
      - run: pnpm check:prisma-integrity
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
        env:
          API_URL: http://127.0.0.1:3001
      # Avoid competing Jest/Vitest coverage processes on the same runner.
      - run: pnpm test:coverage --concurrency=1
      - run: pnpm build
        env:
          API_URL: http://127.0.0.1:3001
      - run: pnpm --filter @revynora/mobile exec expo install --check
      - run: pnpm --filter @revynora/web exec playwright install --with-deps chromium
      - run: pnpm test:prepare
      - name: Historical Web browser validation with filtered diagnostics
        run: node scripts/ci-playwright.cjs --report-dir ci-reports/web-browser --
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            apps/*/coverage
            packages/*/coverage
            ci-reports
