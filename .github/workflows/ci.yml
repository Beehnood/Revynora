name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://revynora:local_dev_only@localhost:5433/revynora_test?schema=public
      TEST_DATABASE_URL: postgresql://revynora:local_dev_only@localhost:5433/revynora_test?schema=public
      WEB_ORIGIN: http://localhost:3000
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: revynora
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: revynora
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U revynora -d revynora"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.6-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check:boundaries
      - run: pnpm check:prisma-integrity
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm --filter @revynora/mobile exec expo install --check
      - run: pnpm --filter @revynora/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            apps/*/coverage
            packages/*/coverage
            apps/web/playwright-report
            apps/web/test-results
