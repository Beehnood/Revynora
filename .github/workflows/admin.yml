name: Admin validation
on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "apps/api/**"
      - "apps/web/**"
      - "prisma/**"
      - "scripts/admin-ci-browser.cjs"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/admin.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/api/**"
      - "apps/web/**"
      - "prisma/**"
      - "scripts/admin-ci-browser.cjs"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/admin.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: admin-validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_API_URL: https://api.revynora.watercode.dev/api/v1
      DATABASE_URL: postgresql://revynora:local_dev_only@127.0.0.1:5433/revynora_test?schema=public
      TEST_DATABASE_URL: postgresql://revynora:local_dev_only@127.0.0.1:5433/revynora_test?schema=public
      G8_ISOLATED_TEST_DB: "true"
      WORKER_ENABLED: "false"
      UX_ARTIFACT_DIR: ${{ github.workspace }}/apps/web/test-results/admin
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: revynora
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: revynora_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U revynora -d revynora_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:prepare
      - run: pnpm exec turbo typecheck --filter=@revynora/admin
        env:
          API_URL: http://127.0.0.1:3001
      - run: pnpm --filter @revynora/admin lint
      - run: pnpm --filter @revynora/admin test:coverage
      - run: pnpm build:admin
        env:
          API_URL: http://127.0.0.1:3001
      - name: Build API and loopback applications for browser tests
        run: pnpm exec turbo build --filter=@revynora/api --filter=@revynora/admin --filter=@revynora/web
        env:
          API_URL: http://127.0.0.1:3411
          ADMIN_ORIGIN: http://127.0.0.1:3412
          NEXT_PUBLIC_WEB_ORIGIN: http://127.0.0.1:3410
      - run: pnpm --filter @revynora/web exec playwright install --with-deps chromium
      - name: Admin regression, responsive and Axe G2–G8
        run: node scripts/admin-ci-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-quality
          path: |
            apps/admin/coverage
            apps/web/test-results/admin
