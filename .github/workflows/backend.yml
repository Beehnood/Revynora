name: Backend validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: backend-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_API_URL: https://api.example.test/api/v1
      ADMIN_WEB_INTEGRATION_ENABLED: "false"
      AI_PROVIDER: mock
      BILLING_PROVIDER: mock
      MAIL_PROVIDER: local
      WORKER_ENABLED: "false"
      COOKIE_SECURE: "false"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      DATABASE_URL: postgresql://revynora:local_dev_only@127.0.0.1:5433/revynora_test?schema=public
      TEST_DATABASE_URL: postgresql://revynora:local_dev_only@127.0.0.1:5433/revynora_test?schema=public
      G8_ISOLATED_TEST_DB: "true"
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: revynora
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: revynora_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U revynora -d revynora_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.6-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify isolated database and Mock providers
        run: |
          node - <<'JS'
          for (const name of ['DATABASE_URL', 'TEST_DATABASE_URL']) {
            const url = new URL(process.env[name]);
            if (url.hostname !== '127.0.0.1' || url.port !== '5433' || url.pathname !== '/revynora_test') throw Error('Isolated CI database required');
          }
          if (process.env.G8_ISOLATED_TEST_DB !== 'true' || process.env.BILLING_PROVIDER !== 'mock' || process.env.AI_PROVIDER !== 'mock' || process.env.STRIPE_SECRET_KEY) throw Error('Mock-only CI required');
          JS
      - run: pnpm exec turbo typecheck --filter=@revynora/api
      - run: pnpm --filter @revynora/api lint
      - run: pnpm test:integration
      - run: pnpm build:api
      - run: docker build -f infra/production/Dockerfile.api --target runtime -t revynora-api:ci .
      - run: docker build -f infra/production/Dockerfile.api --target migration -t revynora-migrate:ci .
      - name: Verify non-root migration tooling without network access
        run: docker run --rm --network none --entrypoint pnpm revynora-migrate:ci --version
